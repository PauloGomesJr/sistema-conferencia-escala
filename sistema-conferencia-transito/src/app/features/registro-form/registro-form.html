<div class="container">
  <h2>📝 Novo Registro de Serviço</h2>

  <form [formGroup]="registroForm" (ngSubmit)="salvar()">
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Data do Serviço</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="data">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Início</mat-label>
        <input matInput type="time" formControlName="horaInicio">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Término</mat-label>
        <input matInput type="time" formControlName="horaFim">
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Código do Serviço (ID)</mat-label>
      <input matInput formControlName="codigoServico" placeholder="Ex: MT02B">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Parceiros (separados por vírgula)</mat-label>
      <input matInput formControlName="parceirosRaw" placeholder="Ex: Silva, Souza, Santos">
      <mat-hint>O sistema separará os nomes automaticamente</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descrição do Serviço</mat-label>
      <textarea matInput formControlName="descricao" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Observações</mat-label>
      <input matInput formControlName="observacao">
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="registroForm.invalid" class="btn-salvar">
      SALVAR SERVIÇO
    </button>
  </form>
</div>
