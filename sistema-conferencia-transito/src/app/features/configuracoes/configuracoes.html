<div class="container-config">
  <h2>Segurança e Backup</h2>
  <p class="aviso">Seus dados são salvos apenas neste dispositivo. Faça backups regulares para não perder seu histórico caso troque de celular.</p>

  <div class="acoes-backup">
    
    <!-- Botão de Exportar -->
    <button mat-raised-button color="primary" (click)="exportarBackup()">
      <mat-icon>cloud_download</mat-icon>
      Exportar Histórico (Backup)
    </button>

    <br>

    <!-- Botão de Importar (Esconde o input feio padrão do HTML) -->
    <button mat-raised-button color="accent" (click)="fileInput.click()">
      <mat-icon>cloud_upload</mat-icon>
      Importar / Restaurar
    </button>
    <input 
      #fileInput 
      type="file" 
      accept=".json" 
      style="display: none" 
      (change)="importarBackup($event)"
    >

  </div>
  <hr style="margin: 24px 0; border: none; border-top: 1px solid #ccc;">

  <div style="display: flex; flex-direction: column; gap: 16px;">
    <h3 style="color: #c62828; margin: 0;">Área de Segurança</h3>
    
      <button mat-flat-button color="warn" (click)="sairDoSistema()" style="padding: 24px 0; font-size: 16px;">
        <mat-icon>logout</mat-icon>
        Sair do Sistema
      </button>
  </div>
</div>
