<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Escala Trânsito</mat-card-title>
      <mat-card-subtitle>Acesso Restrito</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <!-- Mostra mensagem de erro caso erre a senha -->
      <div class="erro-alerta" *ngIf="mensagemErro">
        {{ mensagemErro }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="entrar()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>E-mail corporativo</mat-label>
          <input matInput type="email" formControlName="email" placeholder="agente@exemplo.com">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input matInput type="password" formControlName="senha">
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || carregando">
          {{ carregando ? 'Autenticando...' : 'Entrar' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
