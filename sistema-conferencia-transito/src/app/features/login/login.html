<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header style="margin-bottom: 16px; text-align: center; display: flex; flex-direction: column; align-items: center; width: 100%;">
      <mat-card-title style="font-size: 24px; color: #3f51b5; font-weight: bold;">Bom Serviço</mat-card-title>
      <mat-card-subtitle style="font-size: 14px;">Sistema de Conferência de Escala</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <!-- Mostra mensagem de erro caso erre a senha -->
      @if (mensagemErro) {
        <div class="erro-alerta">
          {{ mensagemErro }}
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="entrar()" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>E-mail corporativo</mat-label>
          <input matInput type="email" formControlName="email" placeholder="agente@exemplo.com">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>
          <input matInput type="password" formControlName="senha">
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || carregando">
          {{ carregando ? 'Autenticando...' : 'Entrar' }}
        </button>
        <div style="text-align: center; margin-top: 16px;">
          <a routerLink="/recuperar-senha" style="color: #3f51b5; text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer;">
            Esqueci minha senha
          </a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
